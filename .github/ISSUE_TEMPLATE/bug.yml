name: Bug report
description: The SDK misbehaves or diverges from the spec
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - event capture / batching
        - identity signing
        - feature flags
        - divergence from kilden-sdk-spec
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: For spec divergences, paste the vector or call that behaves differently — those reports are gold.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
