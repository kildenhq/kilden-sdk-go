name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: freshwork-runners
    strategy:
      matrix:
        go: ["1.22", "1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  spec-vectors:
    runs-on: freshwork-runners
    steps:
      - uses: actions/checkout@v4
        with:
          path: kilden-sdk-go
      - uses: actions/checkout@v4
        with:
          repository: kildenhq/kilden-sdk-spec
          path: kilden-sdk-spec
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test -race ./...
        working-directory: kilden-sdk-go
        env:
          KILDEN_SPEC_DIR: ${{ github.workspace }}/kilden-sdk-spec
